name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e './backend[dev]'
      - run: ruff check app tests
        working-directory: backend
      - run: mypy app
        working-directory: backend
      - run: pytest -m 'not integration'
        working-directory: backend

  remnawave-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/remnawave-adapter/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e './services/remnawave-adapter[dev]'
      - run: ruff check remnawave_adapter tests
        working-directory: services/remnawave-adapter
      - run: mypy remnawave_adapter
        working-directory: services/remnawave-adapter
      - run: pytest
        working-directory: services/remnawave-adapter

  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, customer-frontend, telegram-miniapp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: ${{ matrix.app }}
      - run: npm run typecheck
        working-directory: ${{ matrix.app }}
      - run: npm run build
        working-directory: ${{ matrix.app }}

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        run: HAZBIT_ENV_FILE=./deploy/.env.production.example docker compose --env-file deploy/.env.production.example -f compose.prod.yml config --quiet
      - name: Build production images
        run: HAZBIT_ENV_FILE=./deploy/.env.production.example docker compose --env-file deploy/.env.production.example -f compose.prod.yml build platform remnawave-adapter caddy
